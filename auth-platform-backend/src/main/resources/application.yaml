spring:
  application:
    name: auth-platform-backend

  datasource:
    url: [DB_URL]
    username: [DB_USERNAME]
    password: [DB_PASSWORD]
    driver-class-name: com.mysql.cj.jdbc.Driver

application:
  security:
    jwt:
      secret-key: [JWT_SECRET]
      access-token-expiration: 86400000
      refresh-token-expiration: 604800000